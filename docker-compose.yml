services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server/prisma/data:/app/prisma/data
      - ./server/uploads:/app/uploads
    environment:
      - DATABASE_URL=file:./prisma/data/dev.db
      - JWT_SECRET=your-secret-key
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
